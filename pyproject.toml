[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaomi-photo-recovery"
version = "0.1.0"
description = "Extract surviving media from accessible Xiaomi and Android cache files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.0.0"]

[project.scripts]
xiaomi-recovery = "xiaomi_recovery.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/nullinject/xiaomi-photo-recovery"
Issues = "https://github.com/nullinject/xiaomi-photo-recovery/issues"
