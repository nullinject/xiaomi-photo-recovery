name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tested dependencies and package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Install video test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Unit tests
        run: python -m pytest -q
      - name: Offline demonstration
        run: python examples/synthetic_demo.py
      - name: Audit locked dependencies
        if: matrix.python == '3.12'
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
